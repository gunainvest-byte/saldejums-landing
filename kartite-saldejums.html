<style>
:root{
  --navy:#1B2A41;
  --navy-2:#1F3A5F;
  --gold:#B8924E;
  --gold-soft:#D9C08A;
  --cream:#F7F4EF;
  --ink:#3A3F49;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:transparent;
  font-family:'Jost',system-ui,sans-serif;
  font-weight:300;
  color:var(--ink);
  padding:6px;
}
.demo-note{
  max-width:760px;margin:0 auto 28px;text-align:center;
  font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
}

/* ============ KARTĪTE ============ */
.mk-card{
  max-width:1280px;
  margin:0 auto;
  background:var(--navy);
  border:1px solid var(--gold);
  border-radius:14px;
  padding:44px 48px 40px;
  color:var(--cream);
  position:relative;
  overflow:hidden;
}
.mk-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, var(--gold), var(--gold-soft), var(--gold));
}
.mk-eyebrow{
  font-size:14px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-soft);
  margin:0 0 14px;
}
.mk-title{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:500;
  font-size:clamp(30px,4vw,44px);
  line-height:1.15;
  color:#fff;
  margin:0 0 10px;
  letter-spacing:-.01em;
}
.mk-tagline{
  font-family:'EB Garamond',Georgia,serif;
  font-style:italic;
  font-size:clamp(19px,2.2vw,24px);
  color:var(--gold-soft);
  margin:0 0 24px;
  line-height:1.5;
}
.mk-meta{
  display:flex;flex-wrap:wrap;gap:10px 26px;
  padding:18px 0;
  border-top:1px solid rgba(184,146,78,.35);
  border-bottom:1px solid rgba(184,146,78,.35);
  margin-bottom:26px;
}
.mk-meta span{
  font-size:17px;font-weight:400;letter-spacing:.04em;
  color:rgba(247,244,239,.9);
  display:flex;align-items:center;gap:8px;
}
.mk-meta span::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--gold);flex-shrink:0;
}
.mk-actions{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
}
.mk-btn{
  display:inline-block;
  padding:14px 34px;
  border-radius:6px;
  font-family:'Jost',sans-serif;
  font-size:18px;font-weight:500;letter-spacing:.04em;
  text-decoration:none;
  transition:all .2s;
}
.mk-btn-primary{
  background:var(--gold);
  color:#fff;
  border:1px solid var(--gold);
}
.mk-btn-primary:hover{background:#a5813f;border-color:#a5813f;transform:translateY(-1px)}
.mk-btn-secondary{
  background:transparent;
  color:var(--gold-soft);
  border:1px solid rgba(184,146,78,.7);
}
.mk-btn-secondary:hover{border-color:var(--gold-soft);color:#fff}
.mk-spots{
  font-size:15px;color:var(--gold-soft);letter-spacing:.03em;
  margin-left:auto;
}

.mk-card-media{
  display:grid;
  grid-template-columns:minmax(320px,44%) 1fr;
  gap:0;
  padding:0;
}
.mk-photo{position:relative;min-height:100%}
.mk-photo img{
  width:100%;height:100%;object-fit:cover;display:block;
  border-radius:13px 0 0 13px;
}
.mk-body{padding:40px 44px 36px}
@media(max-width:760px){
  .mk-card-media{grid-template-columns:1fr}
  .mk-photo img{border-radius:13px 13px 0 0;max-height:260px}
  .mk-body{padding:28px 24px 26px}
}
@media(max-width:600px){
  .mk-card{padding:32px 24px 28px}
  .mk-actions{flex-direction:column;align-items:stretch;text-align:center}
  .mk-spots{margin:6px auto 0}
}
</style>
</head>

  <div class="mk-body">
  <p class="mk-eyebrow">Klātienes meistarklase · Rīga</p>
  <h2 class="mk-title">Saldējumu &amp; sorbetu meistarklase</h2>
  <p class="mk-tagline">Uzzini, kāpēc saldējums sanāk ledains — un iemācies pagatavot krēmīgu.</p>
  <div class="mk-meta">

  </div>
  </div>
</div>

</body>
</html>
